<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChefMate 🍳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeIn 0.4s ease-out forwards; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ea580c;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-orange-50 font-sans pb-10">

    <header class="bg-orange-600 shadow-lg p-6 sticky top-0 z-40">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-white text-3xl font-bold flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                👨‍🍳 ChefMate
            </h1>
            
            <div class="flex w-full md:w-1/2 shadow-lg relative">
                <input type="text" id="searchInput" placeholder="Search Noodles, Paneer, Egg..." 
                    class="w-full p-3 rounded-l-lg outline-none text-gray-700" onkeypress="handleEnter(event)">
                <button onclick="getRecipes()" 
                    class="bg-yellow-400 hover:bg-yellow-500 text-orange-900 font-bold p-3 rounded-r-lg transition">
                    Find
                </button>
            </div>
        </div>

        <div class="container mx-auto mt-4 flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="getByCategory('Vegetarian')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md transition transform hover:scale-105 whitespace-nowrap">🥗 Vegetarian</button>
            <button onclick="getByCuisine('Indian')" class="bg-orange-800 hover:bg-orange-900 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md transition transform hover:scale-105 whitespace-nowrap">🇮🇳 Indian</button>
            <button onclick="getByCategory('Breakfast')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md transition transform hover:scale-105 whitespace-nowrap">🥞 Breakfast</button>
            <button onclick="getByCategory('Dessert')" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-md transition transform hover:scale-105 whitespace-nowrap">🍰 Dessert</button>
        </div>
    </header>

    <div class="container mx-auto p-6 min-h-[60vh]">
        <h2 id="resultsTitle" class="text-2xl font-bold text-gray-800 mb-6 hidden">Results</h2>
        <div id="loading" class="hidden text-center mt-10">
            <div class="loader mx-auto"></div>
            <p class="text-gray-500 mt-2 font-medium">Firing up the stove...</p>
        </div>
        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center text-gray-400 mt-10">
                <p class="text-xl font-medium">👆 Type an ingredient above (e.g. "Chicken", "Paneer")</p>
                <p class="text-sm mt-2">or click a category button!</p>
            </div>
        </div>
    </div>

    <div id="modal" style="display: none;" class="fixed inset-0 bg-black bg-opacity-80 flex justify-center items-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative animate-card">
            <div class="flex justify-between items-center p-4 border-b sticky top-0 bg-white z-10">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 truncate pr-4">Recipe</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-4xl leading-none">&times;</button>
            </div>
            <div class="p-6">
                <img id="modalImg" class="w-full h-64 object-cover rounded-xl shadow-md mb-6" src="" alt="">
                
                <h3 class="font-bold text-lg mb-2 text-orange-600">📝 Instructions:</h3>
                <p id="modalInstructions" class="text-gray-700 whitespace-pre-line text-sm mb-8 p-4 bg-orange-50 rounded-lg border border-orange-100"></p>
                
                <h3 class="font-bold text-lg mb-3 text-orange-600">🎥 Actions:</h3>
                
                <div class="flex flex-col md:flex-row gap-4 justify-center items-center mb-6">
                    <a id="youtubeDirectBtn" href="#" target="_blank" class="w-full md:w-auto inline-flex justify-center items-center gap-2 bg-red-600 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-red-700 transition transform hover:scale-105">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                        Watch on YouTube
                    </a>
                    <button onclick="shareToWhatsapp()" class="w-full md:w-auto inline-flex justify-center items-center gap-2 bg-green-500 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-green-600 transition transform hover:scale-105">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.008-.57-.008-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        Share on WhatsApp
                    </button>
                </div>
                <p class="text-xs text-center text-gray-400">Buttons open in new tabs</p>
            </div>
        </div>
    </div>

    <script>
        let currentMeal = {}; 

        async function fetchFromBackend(endpoint, title) {
            const grid = document.getElementById('recipeGrid');
            const loading = document.getElementById('loading');
            const titleEl = document.getElementById('resultsTitle');

            grid.innerHTML = "";
            titleEl.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const res = await fetch(`http://localhost:3000${endpoint}`);
                if (!res.ok) throw new Error("Server not reachable");
                const meals = await res.json();

                loading.classList.add('hidden');
                titleEl.innerText = title;
                titleEl.classList.remove('hidden');

                if (!meals || meals.length === 0) {
                    grid.innerHTML = `<p class="text-center text-gray-500 col-span-full text-lg">😕 No recipes found. Try a different term!</p>`;
                    return;
                }
                displayMeals(meals);
            } catch (error) {
                loading.classList.add('hidden');
                grid.innerHTML = `<p class="text-center text-red-500 col-span-full">⚠️ Server Error. Check terminal.</p>`;
            }
        }

        function getRecipes() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) return alert("Please type something!");
            fetchFromBackend(`/recipes/${input}`, `Results for "${input}"`);
        }
        function getByCategory(cat) { fetchFromBackend(`/category/${cat}`, `${cat} Recipes`); }
        function getByCuisine(area) { fetchFromBackend(`/cuisine/${area}`, `${area} Cuisine`); }

        function displayMeals(meals) {
            const grid = document.getElementById('recipeGrid');
            meals.forEach((meal, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-2xl transition duration-300 transform hover:-translate-y-1 cursor-pointer border border-gray-100 animate-card";
                card.style.animationDelay = `${index * 0.1}s`; 
                card.onclick = () => showDetails(meal.idMeal);
                card.innerHTML = `
                    <div class="relative">
                        <img src="${meal.strMealThumb}" class="w-full h-48 object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                        <h3 class="absolute bottom-3 left-3 font-bold text-white text-lg drop-shadow-md truncate w-11/12">${meal.strMeal}</h3>
                    </div>
                    <div class="p-4 flex justify-between items-center">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Tap to View</span>
                        <span class="bg-orange-50 text-orange-600 rounded-full p-1">➔</span>
                    </div>`;
                grid.appendChild(card);
            });
        }

        async function showDetails(id) {
            try {
                const res = await fetch(`http://localhost:3000/details/${id}`);
                const meal = await res.json();
                currentMeal = meal; // Store for sharing

                document.getElementById('modalTitle').innerText = meal.strMeal;
                document.getElementById('modalImg').src = meal.strMealThumb;
                document.getElementById('modalInstructions').innerText = meal.strInstructions;

                const directBtn = document.getElementById('youtubeDirectBtn');
                
                // FORCE A LINK GENERATION FOR THE BUTTON TOO
                let videoLink = meal.strYoutube;
                if (!videoLink || videoLink.trim() === "") {
                    // Create search link if missing
                    videoLink = `https://www.youtube.com/results?search_query=how+to+cook+${encodeURIComponent(meal.strMeal)}`;
                }
                directBtn.href = videoLink;

                document.getElementById('modal').style.display = 'flex'; 
            } catch (error) { console.error(error); }
        }

        // --- FINAL FIXED WHATSAPP LOGIC ---
        function shareToWhatsapp() {
            if (!currentMeal.strMeal) return;

            // 1. Ingredients List
            let message = `*Shopping List for ${currentMeal.strMeal}* 🍳\n\n`;
            
            for(let i=1; i<=20; i++) {
                let ing = currentMeal[`strIngredient${i}`];
                let measure = currentMeal[`strMeasure${i}`];
                if(ing && ing.trim() !== "") {
                    if (!measure) measure = "";
                    message += `✅ ${measure} ${ing}\n`;
                }
            }

            // 2. VIDEO LINK (Forced to exist)
            let videoLink = currentMeal.strYoutube;

            // If link is missing, null, or empty -> CREATE IT
            if (!videoLink || videoLink.trim() === "") {
                videoLink = `https://www.youtube.com/results?search_query=how+to+cook+${encodeURIComponent(currentMeal.strMeal)}`;
            }

            message += `\n🎥 *Watch Video:* ${videoLink}\n`;
            message += `\nSent via ChefMate App!`;
            
            let url = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function handleEnter(e) { if (e.key === 'Enter') getRecipes(); }
    </script>
</body>
</html>
